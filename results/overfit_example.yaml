src: "ich erkl\xE4re die am freitag, dem 17. dezember unterbrochene sitzungsperiode\
  \ des europ\xE4ischen parlaments f\xFCr wiederaufgenommen, w\xFCnsche ihnen nochmals\
  \ alles gute zum jahreswechsel und hoffe, da\xDF sie sch\xF6ne ferien hatten."
tgt: i declare resumed the session of the european parliament adjourned on friday
  17 december 1999, and i would like once again to wish you a happy new year in the
  hope that you enjoyed a pleasant festive period.
